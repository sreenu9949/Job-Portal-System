<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Job Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            overflow: hidden;
        }

        /* Background animation */
        .bg-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.12), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255,255,255,0.1), transparent 40%);
            animation: bgMove 12s infinite alternate;
        }

        @keyframes bgMove {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* Center wrapper */
        .login-wrapper {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Glass card */
        .login-card {
            width: 380px;
            padding: 45px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            border-radius: 22px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.45);
            color: #fff;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Brand */
        .brand h1 {
            text-align: center;
            font-size: 34px;
            letter-spacing: 1px;
        }

        .brand span {
            color: #00d4ff;
        }

        .brand p {
            text-align: center;
            margin-top: 6px;
            margin-bottom: 30px;
            font-size: 14px;
            opacity: 0.85;
        }

        /* Input fields */
        .input-group {
            position: relative;
            margin-bottom: 28px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.45);
            outline: none;
            color: #fff;
            font-size: 16px;
        }

        .input-group label {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.65);
            pointer-events: none;
            transition: 0.3s ease;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -8px;
            font-size: 12px;
            color: #00d4ff;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0,212,255,0.55);
        }

        /* Links */
        .links {
            margin-top: 22px;
            text-align: center;
        }

        .links a {
            color: #00d4ff;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="bg-animation"></div>

<div class="login-wrapper">
    <div class="login-card">

        <div class="brand">
            <h1>Job<span>Portal</span></h1>
            <p>Login to your account</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <input type="text" name="username" required>
                <label>Username</label>
            </div>

            <div class="input-group">
                <input type="password" name="password" required>
                <label>Password</label>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="links">
            <a href="{% url 'register' %}">Create New Account</a>
        </div>

    </div>
</div>

</body>
</html>
